[package]
name = "sys-daemon"
version = "0.1.0"
edition = "2021"
description = "Event-driven system status daemon: waybar JSON streams + dev-ports dashboard"
license = "MIT"

[dependencies]
anyhow = "1"
futures-util = "0.3"
inotify = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
zbus = "4"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
